<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Google Tag (GA4 + Google Ads) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-TH706HFHW"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){ dataLayer.push(arguments); }
      gtag("js", new Date());

      // GA4
      gtag("config", "G-TH706HFHW");

      // Google Ads
      gtag("config", "AW-17931609279");
    </script>

    <!-- Google Ads Conversion: Tel-Klick (React-safe) -->
    <script>
      // HIER deine Google-Ads Conversion-ID/Label rein:
      // Google Ads -> Conversions -> (deine Aktion) -> "Tag einrichten" -> "Ereignis-Snippet"
      // send_to sieht so aus: "AW-17931609279/XXXXXXXXXXXX"
      const SEND_TO = "AW-17931609279/-jKTCU7Z5fwbEL_JuuZC";

      function attachTelClickTracking() {
        const links = document.querySelectorAll('a[href^="tel:"]');
        links.forEach((link) => {
          if (link.dataset.telTracked === "1") return;
          link.dataset.telTracked = "1";

          link.addEventListener("click", function (e) {
            if (typeof window.gtag !== "function") return;

            const href = link.getAttribute("href");
            if (!href) return;

            // iOS/Android: kurz Conversion feuern, dann Tel öffnen
            e.preventDefault();

            let done = false;
            const proceed = () => {
              if (done) return;
              done = true;
              window.location.href = href;
            };

            window.gtag("event", "conversion", {
              send_to: SEND_TO,
              event_callback: proceed,
              event_timeout: 500,
            });

            // Fallback, falls callback nicht kommt
            setTimeout(proceed, 600);
          });
        });
      }

      // Direkt beim Laden
      document.addEventListener("DOMContentLoaded", attachTelClickTracking);

      // React/Vite: Elemente können später kommen -> regelmäßig neu anheften
      setInterval(attachTelClickTracking, 800);
    </script>

    <link rel="stylesheet" href="/src/index.css" />
    <link rel="icon" type="image/webp" href="/LogoQuadrat.webp" />
    <title>ExpertRohr – Rohrreinigung Berlin & Brandenburg</title>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
